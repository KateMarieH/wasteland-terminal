<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasteland Terminal</title>

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/grid.css">
</head>

<body>

  <!-- Announcement Bar -->
  <div id="announcement-bar"></div>

  <!-- Header -->
  <header id="header">
    <h1>WASTELAND TERMINAL</h1>

    <nav id="top-links">
      <a href="#">SUPPORT THE TERMINAL</a>
      <a href="#">DISCORD</a>
      <a href="#">YOUTUBE</a>
    </nav>

    <nav id="subnav">
      <a href="index.html">Terminal</a>
      <a href="about.html">About</a>
    </nav>
  </header>

  <!-- Row 1: Live Systems -->
  <section id="live-systems" class="grid-3">
    <div id="weather" class="panel">
  <div id="wx-location">LOCATION: —</div>
  <div id="wx-now">NOW: —</div>
  <div id="wx-meta">—</div>

  <input id="wx-input" type="text" placeholder="Enter city or ZIP">
  <button id="wx-use-loc">Use My Location</button>
  <button id="wx-use-saved">Use Saved</button>
</div>

    <div id="radio" class="panel">
  <div id="radio-title">MYSTIC BROADCAST RADIO</div>

  <div id="radio-now">
    NOW PLAYING:
    <span class="cc_streaminfo" data-type="song" data-username="themysti">Loading…</span>
  </div>

  <div id="radio-artist">
    ARTIST:
    <span class="cc_streaminfo" data-type="trackartist" data-username="themysti"></span>
  </div>

  <div id="radio-playlist">
    PROGRAM:
    <span class="cc_streaminfo" data-type="trackplaylist" data-username="themysti"></span>
  </div>

  <audio id="radio-player" controls preload="none">
    <source src="https://radio.shoutcheap.com/proxy/themysti/stream" type="audio/mpeg">
  </audio>
</div>

    <div id="news" class="panel">News</div>
  </section>

  <!-- Row 2: Weekly Features -->
  <section id="weekly-features" class="grid-3">
    <div id="fan-art" class="panel">Fan Art</div>
    <div id="mystic-rec" class="panel">Mystic’s Rec</div>
    <div id="archive-find" class="panel">Archive Find</div>
  </section>

  <script src="js/utils.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="https://radio.shoutcheap.com/system/streaminfo.js"></script>


</body>
</html>
