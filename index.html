<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wasteland Terminal</title>

  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/grid.css">
</head>

<body>

  <!-- Announcement Bar -->
  <div id="announcement-bar"></div>
  <!-- Header -->
  <header id="header">
    <h1>WASTELAND TERMINAL</h1>
   <nav id="top-links">
  <a href="https://www.patreon.com/c/wastelandterminal/membership"
     target="_blank" rel="noopener noreferrer">
     SUPPORT THE TERMINAL
  </a>
  <a href="https://discord.gg/Hngrkw7EZF"
     target="_blank" rel="noopener noreferrer">
     DISCORD
  </a>
  <a href="https://www.youtube.com/@TheMysticBroadcast"
     target="_blank" rel="noopener noreferrer">
     YOUTUBE
  </a>
</nav>


    <nav id="subnav">
    </nav>
  </header>

  <!-- Row 1: Live Systems -->
  <section id="live-systems" class="grid-3">
    <div id="weather" class="panel">
  <div id="wx-location">LOCATION: —</div>
  <div id="wx-now">NOW: —</div>
  <div id="wx-meta">—</div>

  <input id="wx-input" type="text" placeholder="Enter city or ZIP">
  <button id="wx-use-loc">Use My Location</button>
  <button id="wx-use-saved">Use Saved</button>
</div>

    <div id="radio" class="panel">
  <div id="radio-title">
    MYSTIC BROADCAST RADIO <span id="on-air">●</span>
  </div>

  <div id="radio-now">
    NOW PLAYING:
    <span class="cc_streaminfo" data-type="song" data-username="themysti">Loading…</span>
  </div>

  <div id="radio-block">
    PROGRAM:
    <span class="cc_streaminfo" data-type="trackplaylist" data-username="themysti"></span>
  </div>
      <div id="radio-upnext">
  UP NEXT (PST): <span id="radio-upnext-name">—</span> at <span id="radio-upnext-time">—</span>
</div>

  <!-- Custom radio controls -->
  <div id="radio-controls">
    <button id="radio-toggle">▶ PLAY</button>
    <input id="radio-volume" type="range" min="0" max="1" step="0.01" value="0.2">
  </div>

  <!-- Hidden native audio element -->
  <audio id="radio-player" preload="none">
    <source src="https://radio.shoutcheap.com/proxy/themysti/stream" type="audio/mpeg">
  </audio>
</div>



   <div id="news" class="panel">
  <div id="news-title">WASTELAND BULLETIN</div>

  <ul id="newsList"></ul>

  <div id="news-meta">
    <span id="newsSource">—</span>
    <span id="newsUpdated">—</span>
    <button id="newsRefresh">REFRESH</button>
  </div>
</div>
</section>   <!-- CLOSE live-systems -->
<section id="weekly-features" class="grid-3">


  <div id="fan-art" class="panel weekly-panel">
    <h3 class="panel-title">FAN ART OF THE WEEK</h3>
    <img id="fanArtImage" class="weekly-image" />
    <div id="fanArtTitle" class="weekly-title"></div>
    <a id="fanArtLink" class="weekly-link" target="_blank" rel="noopener noreferrer"></a>
    <p id="fanArtCaption" class="weekly-caption"></p>
  </div>

  <div id="mystic-rec" class="panel weekly-panel">
    <h3 class="panel-title">MYSTIC’S REC</h3>
    <img id="recImage" class="weekly-image" />
    <div id="recTitle" class="weekly-title"></div>
    <a id="recLink" class="weekly-link" target="_blank" rel="noopener noreferrer"></a>
    <p id="recCaption" class="weekly-caption"></p>
  </div>

  <div id="archive-find" class="panel weekly-panel">
    <h3 class="panel-title">ARCHIVE FIND</h3>
    <img id="archiveImage" class="weekly-image" />
    <div id="archiveTitle" class="weekly-title"></div>
    <a id="archiveLink" class="weekly-link" target="_blank" rel="noopener noreferrer"></a>
    <p id="archiveCaption" class="weekly-caption"></p>
  </div>

</section>





  <script src="js/utils.js" defer></script>
  <script src="js/main.js" defer></script>
  <script src="https://radio.shoutcheap.com/system/streaminfo.js"></script>


</body>
</html>
